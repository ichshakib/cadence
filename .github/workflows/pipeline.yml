name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: TypeCheck & Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'chrome-extension/pnpm-lock.yaml'

      - name: Install Extension Dependencies
        working-directory: chrome-extension
        run: pnpm install --frozen-lockfile

      - name: TypeCheck & Build Extension
        working-directory: chrome-extension
        run: pnpm build

      - name: Upload Extension Release Archive
        uses: actions/upload-artifact@v4
        with:
          name: cadence-extension-release
          path: chrome-extension/release/*.zip
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build-and-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built Extension
        uses: actions/download-artifact@v4
        with:
          name: cadence-extension-release
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
