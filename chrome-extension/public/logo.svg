<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cadence Brand Gradient -->
    <linearGradient id="cadenceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="55%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Subtle Optical Lighting -->
    <linearGradient id="cadenceGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#cadenceGradient)" />
  <rect x="32" y="32" width="448" height="224" rx="108" fill="url(#cadenceGloss)" />

  <!-- Cadence Speech Rhythm / Audio Waves -->
  <g fill="#FFFFFF">
    <rect x="153" y="170" width="22" height="64" rx="11" />
    <rect x="199" y="140" width="22" height="124" rx="11" />
    <rect x="245" y="114" width="22" height="176" rx="11" />
    <rect x="291" y="146" width="22" height="112" rx="11" />
    <rect x="337" y="176" width="22" height="52" rx="11" />
  </g>

  <!-- Bilingual Subtitle Bars -->
  <!-- Primary Subtitle Track (Pure White) -->
  <g fill="#FFFFFF">
    <rect x="126" y="322" width="160" height="22" rx="11" />
    <rect x="302" y="322" width="84" height="22" rx="11" />
  </g>

  <!-- Secondary / Translated Subtitle Track (Luminous 75% White) -->
  <g fill="#FFFFFF" opacity="0.75">
    <rect x="126" y="362" width="94" height="22" rx="11" />
    <rect x="236" y="362" width="150" height="22" rx="11" />
  </g>
</svg>
